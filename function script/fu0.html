<!DOCTYPE html>
<html>
<head>
<title>Function with Parameter</title>
</head>

<body>

<h2>Welcome Function</h2>

<button onclick="welcome('monu')">Show Message</button>

<p id="demo"></p>

<script>
function welcome(name) {
   document.getElementById("demo").innerHTML =
   "hello " + name;
}
</script>

</body>
</html>
