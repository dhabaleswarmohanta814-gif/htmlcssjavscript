<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Function Example</title>
</head>
<body>

<h2>JavaScript Function Example</h2>

<button onclick="addNumbers()">Click </button>

<p id="result"></p>

<script>
function addNumbers() {
    let a = 50;
    let b = 20;
    let sum = a + b;

    document.getElementById("result").innerHTML =
        "Sum = " + sum;
}
</script>

</body>
</html>
