<!DOCTYPE html>
<html>
<head>
    <title>Class and Object</title>
</head>
<body>

<h2>JavaScript Class and Object Example</h2>

<script>
class Student {


    constructor(name, age) {
        this.name = name;
        this.age = age;
    }


    display() {
        document.write("Name: " + this.name + "<br>");
        document.write("Age: " + this.age + "<br>");
    }
}

let s1 = new Student("Rahul", 20);

s1.display();

</script>

</body>
</html>
