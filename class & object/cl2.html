<!DOCTYPE html>
<html>
<body>

<script>

class Employee {
    constructor(name) {
        this.name = name;
    }

    work() {
        document.write(this.name + " is working<br>");
    }
}

let e1 = new Employee("Ram");
let e2 = new Employee("Shyam");

e1.work();
e2.work();

</script>

</body>
</html>
