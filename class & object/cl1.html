<script>

class Car {
    constructor(brand, color) {
        this.brand = brand;
        this.color = color;
    }

    show() {
        document.write(this.brand + " - " + this.color + "<br>");
    }
}

let car1 = new Car("BMW", "Black");
let car2 = new Car("Tesla", "White");

car1.show();
car2.show();

</script>
