<!DOCTYPE html>
<html>
<head>
    <title>Logical Operators</title>
</head>
<body>

<script>
    var age = 25;
    var salary = 30000;

    document.write("age >= 18 && salary >= 25000 : "
        + (age >= 18 && salary >= 25000) + "<br>");

    document.write("age < 18 || salary >= 25000 : "
        + (age < 18 || salary >= 25000) + "<br>");

    document.write("!(age < 18) : "
        + !(age < 18) + "<br>");
</script>

</body>
</html>
