<!DOCTYPE html>
<html>
<head>
    <title>Arithmetic Operators Example</title>
</head>
<body>

    <h2>Arithmetic Operators in JavaScript</h2>

    <script>
        let a = 10;
        let b = 5;

        document.write("a = " + a + "<br>");
        document.write("b = " + b + "<br><br>");

        // Addition
        document.write("a + b = " + (a + b) + "<br>");

        // Subtraction
        document.write("a - b = " + (a - b) + "<br>");

        // Multiplication
        document.write("a * b = " + (a * b) + "<br>");

        // Division
        document.write("a / b = " + (a / b) + "<br>");

        // Modulus
        document.write("a % b = " + (a % b) + "<br>");

        // Exponentiation
        document.write("a ** b = " + (a ** b) + "<br>");
    </script>

</body>
</html>
