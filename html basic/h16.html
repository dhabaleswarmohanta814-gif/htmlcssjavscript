<!DOCTYPE html>
<html>
<head>
	<title>Registration form</title>
</head>
<body>
	<h2>Registration form</h2>
	<form>
		<b>name:</b><br>
		<input type="text" name="name" required><br><br>

		<b>Email:</b><br>
		<input type="Email" name="Email" required><br><br>

		<b>username:</b><br>
		<input type="text" name="username" required><br><br>

		<b>password:</b><br>
		<input type="password" name="password" required><br><br>

		<b>conform password:</b><br>
		<input type="password" name="confirm_password" required><br><br>

		Gender:<br>
		<input type="radio" name="gender" value="male"><b>male</b>
		<input type="radio" name="gender" value="female"><b>female</b>
		<br><br>
		<h2>select country name</h2>
		<select name="country"><br>
			<option value="india">india </option><br>
			<option value="china">china</option><br>
			<option value="sri lanka">sri lanka</option><br>
		</select><br><br>
		<h2>hobbies</h2>
		<input type="checkbox" name="hobbies" value="music">music<br>
		<input type="checkbox" name="hobbies" value="traveling">traveling<br>
		<input type="submit" value="submit">
	</form>

</body>
</html>
